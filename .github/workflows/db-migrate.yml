# ===========================================================================
# RDS スキーマ初期化 / マイグレーション (手動実行)
#
# データ保護のため push 自動実行はせず workflow_dispatch のみ。
# RDS へは VPC 内の EC2 を踏み台にして到達する (GitHub ランナーは動的 IP のため
# プライベート RDS に直接到達不可)。psql は EC2 上の使い捨てコンテナで実行。
#
# action=init   : 空 DB に db/init を投入 (既存があれば中止)。現行マイグレーションは baseline 記録。
# action=migrate: db/migration の未適用スキーマのみ適用 (MIG-3 データ取込は除外、UI で実施)。
# action=reinit : public スキーマを DROP して init と同手順で再構築 (プラットフォーム統合改修の
#                 ような破壊的スキーマ再編用・稼働前環境専用)。confirm_reinit=true が必須。
#
# APP_DB_PASSWORD secret: アプリ接続ロール akebono_app のパスワード。
# init/reinit では必須 (未設定はエラー終了)。migrate では任意 (設定時のみ ALTER ROLE 反映)。
# ===========================================================================
name: DB Init / Migrate (RDS)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'init = 空DBにスキーマ投入(既存があれば中止) / migrate = 未適用マイグレーション適用 / reinit = 破壊的再構築(稼働前専用)'
        type: choice
        options: [migrate, init, reinit]
        default: migrate
      confirm_reinit:
        description: 'reinit の場合のみ: 破壊的再構築を承認する (true 必須)'
        type: boolean
        default: false
  # deploy.yml の統合パイプラインから「backend デプロイ前の前進マイグレーション」として呼ばれる。
  # 呼び出し側は action=migrate 固定 (init/reinit の破壊的操作は自動化しない・手動 dispatch のみ)。
  workflow_call:
    inputs:
      action:
        description: 'workflow_call では migrate 固定を想定 (前進専用・冪等)'
        type: string
        default: migrate
      confirm_reinit:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # secrets は if: で直接参照できない (GitHub Actions 仕様)。env に展開して presence 判定する。
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      # EC2_HOST を直接指定する運用では AWS は不要 (AWS_ROLE_ARN 未設定ならスキップ)。
      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to EC2
        id: ec2
        uses: ./.github/actions/ec2-connect
        with:
          ec2-host: ${{ secrets.EC2_HOST }}
          ec2-instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          ssh-user: ${{ secrets.EC2_SSH_USER }}
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}

      - name: Render .dbenv (DB 接続情報)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST}" ] || [ -z "${DB_NAME}" ] || [ -z "${DB_ADMIN_USER}" ] || [ -z "${DB_ADMIN_PASSWORD}" ]; then
            echo "::error::DB_HOST / DB_NAME / DB_ADMIN_USER / DB_ADMIN_PASSWORD secret が未設定です" >&2
            exit 1
          fi
          # init / reinit は akebono_app のパスワード設定 (APP_DB_PASSWORD) が必須
          # (既知の既定値のまま本番 DB が構築される事故防止。run-migrations.sh 側にも同ゲートあり)
          if [ "${{ inputs.action }}" != "migrate" ] && [ -z "${APP_DB_PASSWORD:-}" ]; then
            echo "::error::APP_DB_PASSWORD secret が未設定です (init/reinit では必須)" >&2
            exit 1
          fi
          {
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=${DB_PORT:-5432}"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_ADMIN_USER=${DB_ADMIN_USER}"
            echo "DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD}"
            if [ -n "${APP_DB_PASSWORD:-}" ]; then
              echo "APP_DB_PASSWORD=${APP_DB_PASSWORD}"
            fi
          } > deploy/db/.dbenv

      - name: Copy migration bundle to EC2
        env:
          HOST: ${{ steps.ec2.outputs.host }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${SSH_USER}@${HOST}" \
            'rm -rf ~/akebono-migrate && mkdir -p ~/akebono-migrate'
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -r \
            db deploy/db/run-migrations.sh deploy/db/.dbenv \
            "${SSH_USER}@${HOST}:~/akebono-migrate/"

      - name: Run on EC2 (action=${{ inputs.action }})
        env:
          HOST: ${{ steps.ec2.outputs.host }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          ACTION: ${{ inputs.action }}
          CONFIRM_REINIT: ${{ inputs.confirm_reinit == true && 'yes' || '' }}
        run: |
          set -euo pipefail
          if [ "${ACTION}" = "reinit" ] && [ "${CONFIRM_REINIT}" != "yes" ]; then
            echo "::error::action=reinit には confirm_reinit=true が必須です (破壊的操作の二重確認)" >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${SSH_USER}@${HOST}" \
            "cd ~/akebono-migrate && ACTION='${ACTION}' CONFIRM_REINIT='${CONFIRM_REINIT}' bash run-migrations.sh && rm -rf ~/akebono-migrate"

      - name: Cleanup local secrets
        if: always()
        run: rm -f deploy/db/.dbenv
