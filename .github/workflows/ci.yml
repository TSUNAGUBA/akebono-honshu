# ===========================================================================
# CI: ビルド / 型チェック (PR ゲート)
#
# 既存 pr-checks.yml は PR メタデータ (Issue 参照 / セルフチェック) を検証する別役割。
# 本ワークフローはコンパイル/型の早期検知を担う (migration-plan §5.2 の意図)。
# テストプロジェクトは未整備のため、Backend は dotnet build で疎通確認する。
#
# トリガーは PR のみ（+ 手動）。main への push 時の検証は統合デプロイパイプライン
# deploy.yml のテストゲート（本 CI と同等の build/typecheck/openapi/docker を実行）が担うため、
# push:[main] は持たない（二重実行を避ける・原則3）。
# ⚠️ 本 CI の検証内容と deploy.yml のテストゲート（DEFAULT_UNIT/INTEGRATION/SCENARIO_TEST_CMD）は
#    一致させること。片方だけ変更すると PR ゲートとデプロイゲートが別物を検証する状態に分岐する。
# ===========================================================================
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore & build (Release)
        run: dotnet build src/Backend/Akebono.sln -c Release

  # ドメイン純粋関数の単体テスト (xUnit)。勤怠計算 (AttendanceCalc: 週40h/深夜/36協定/有効打刻等) の
  # 正しさを実アサーションで検証する。deploy.yml のテストゲート単体ステージと同一の検証。
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests (Akebono.Domain.Tests)
        run: dotnet test src/Backend/tests/Akebono.Domain.Tests/Akebono.Domain.Tests.csproj -c Release

  backend-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (no push) — Dockerfile とビルドコンテキストを検証
        # ci.yml の dotnet build はフルリポジトリで通るため Docker の context 制限を検知できない。
        # 本番と同じ context=repo root で docker build し、CS1566 等 (埋込リソースの欠落) を PR で捕捉する。
        run: docker build -f src/Backend/Dockerfile -t akebono-honshu-backend:ci .

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: src/Frontend
        run: pnpm install --no-frozen-lockfile
      - name: Type check (nuxi typecheck)
        working-directory: src/Frontend
        run: pnpm run typecheck

  # 結合テスト: 使い捨て Postgres に db/init を投入し backend を**実際に起動**して HTTP 検証する。
  # /health(起動+スキーマ整合) / CORS プリフライト / OpenAPI 一致 を一度の起動でまとめて検証。
  # deploy.yml のテストゲート結合ステージと同一 (scripts/integration-test.sh 経由・PR とデプロイで同期)。
  # これにより「スキーマ移行漏れで起動不能」「CORS 崩れ」「仕様乖離」を PR 段階で捕捉する。
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akebono_honshu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Integration test (boot backend + /health + CORS + OpenAPI)
        run: bash scripts/integration-test.sh
