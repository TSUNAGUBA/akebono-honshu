# ===========================================================================
# CI: ビルド / 型チェック (PR ゲート)
#
# 既存 pr-checks.yml は PR メタデータ (Issue 参照 / セルフチェック) を検証する別役割。
# 本ワークフローはコンパイル/型の早期検知を担う (migration-plan §5.2 の意図)。
# テストプロジェクトは未整備のため、Backend は dotnet build で疎通確認する。
#
# トリガーは PR のみ（+ 手動）。main への push 時の検証は統合デプロイパイプライン
# deploy.yml のテストゲート（本 CI と同等の build/typecheck/openapi/docker を実行）が担うため、
# push:[main] は持たない（二重実行を避ける・原則3）。
# ===========================================================================
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore & build (Release)
        run: dotnet build src/Backend/Akebono.sln -c Release

  backend-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (no push) — Dockerfile とビルドコンテキストを検証
        # ci.yml の dotnet build はフルリポジトリで通るため Docker の context 制限を検知できない。
        # 本番と同じ context=repo root で docker build し、CS1566 等 (埋込リソースの欠落) を PR で捕捉する。
        run: docker build -f src/Backend/Dockerfile -t akebono-honshu-backend:ci .

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: src/Frontend
        run: pnpm install --no-frozen-lockfile
      - name: Type check (nuxi typecheck)
        working-directory: src/Frontend
        run: pnpm run typecheck

  # OpenAPI 仕様と実装の一致検証 (AKB-DOC-12 §4-1)。
  # scripts/generate-openapi.sh がアプリをスタブ構成で起動し swagger.json を取得、
  # コミット済み docs/api/openapi.json と diff。乖離があれば fail
  # (API を変更したらスクリプトを再実行して openapi.json を更新・コミットする)。
  openapi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate OpenAPI spec from implementation
        run: |
          cp docs/api/openapi.json /tmp/openapi-committed.json
          bash scripts/generate-openapi.sh
      - name: Diff against committed spec
        run: |
          if ! diff -u /tmp/openapi-committed.json docs/api/openapi.json; then
            echo "::error::docs/api/openapi.json が実装と乖離しています。scripts/generate-openapi.sh を実行してコミットしてください" >&2
            exit 1
          fi
          echo "OpenAPI spec is in sync with the implementation."
