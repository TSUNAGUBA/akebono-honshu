# ===========================================================================
# OpenAPI 仕様の再生成 (ローカルに dotnet が無い環境向けの CI 再生成フロー)
#
# 目的: docs/api/openapi.json を CI 上で scripts/generate-openapi.sh により再生成し、
#   (1) 生成物をアーティファクトとして出力 (openapi-json)
#   (2) 変化があればトリガーブランチ(PR head)へコミット & push
#   これにより、ローカルに dotnet/bash/jq が無くても実装と一致した openapi.json を得られる。
#
# トリガー: chore/regen-openapi ブランチを main 向けに PR にすると pull_request で自動実行される
#   (同一リポジトリの PR は head ブランチのワークフローが動くため確実)。push / 手動実行にも対応。
# ===========================================================================
name: Regenerate OpenAPI spec

on:
  workflow_dispatch:
  push:
    branches: [chore/regen-openapi]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR の head ブランチをチェックアウトして、生成物を同ブランチへ push できるようにする。
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Regenerate openapi.json
        # ci.yml の openapi-check と同一スクリプト (dotnet run で swagger を取得し jq -S で整形)。
        run: bash scripts/generate-openapi.sh
      - name: Upload generated spec as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: docs/api/openapi.json
      - name: Commit regenerated spec back to the branch
        run: |
          if git diff --quiet -- docs/api/openapi.json; then
            echo "openapi.json は既に実装と一致しています (コミット不要)。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "docs: regenerate openapi.json (factories/tax-rates/users)"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
