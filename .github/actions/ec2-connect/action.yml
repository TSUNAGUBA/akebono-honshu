# ===========================================================================
# 複合アクション: EC2 接続準備
#
# 役割: デプロイ系ワークフロー (deploy-backend / db-migrate) で重複する
#       「EC2 ホスト解決 + SSH 秘密鍵/known_hosts 準備」を 1 箇所に集約する
#       (CLAUDE.md 原則 3: 既存パターンの再利用 / 重複排除)。
#
# 前提: 呼び出し側ワークフローで先に actions/checkout と
#       aws-actions/configure-aws-credentials (OIDC) を実行しておくこと。
#       ec2-host が空のときのみ AWS API (ec2:DescribeInstances) を使う。
#
# 出力: host = 解決された EC2 ホスト (DNS or IP)。SSH 鍵は ~/.ssh/deploy_key。
# ===========================================================================
name: 'EC2 Connect'
description: 'EC2 ホストを解決 (instance-id→AWS or 明示host) し、SSH 鍵と known_hosts を準備する'

inputs:
  ec2-host:
    description: '明示的な EC2 ホスト (DNS/IP)。空なら ec2-instance-id から AWS 経由で解決する'
    required: false
    default: ''
  ec2-instance-id:
    description: 'EC2 インスタンス ID (ec2-host が空のとき使用)'
    required: false
    default: ''
  ssh-user:
    description: 'SSH ユーザ (例: ubuntu)'
    required: true
  ssh-private-key:
    description: 'SSH 秘密鍵 (repository secret)'
    required: true
  ssh-known-hosts:
    description: '固定 known_hosts (任意、推奨)。指定すれば MITM 検証あり。未指定時は ssh-keyscan TOFU。'
    required: false
    default: ''

outputs:
  host:
    description: '解決された EC2 ホスト'
    value: ${{ steps.resolve.outputs.host }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        EC2_HOST: ${{ inputs.ec2-host }}
        EC2_INSTANCE_ID: ${{ inputs.ec2-instance-id }}
      run: |
        set -euo pipefail
        HOST="${EC2_HOST}"
        if [ -z "${HOST}" ]; then
          if [ -z "${EC2_INSTANCE_ID}" ]; then
            echo "::error::ec2-host か ec2-instance-id のいずれかを指定してください" >&2
            exit 1
          fi
          echo "Resolving address for instance ${EC2_INSTANCE_ID} via ec2:DescribeInstances ..."
          HOST="$(aws ec2 describe-instances --instance-ids "${EC2_INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].PublicDnsName' --output text)"
          if [ -z "${HOST}" ] || [ "${HOST}" = "None" ]; then
            HOST="$(aws ec2 describe-instances --instance-ids "${EC2_INSTANCE_ID}" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
          fi
          if [ -z "${HOST}" ] || [ "${HOST}" = "None" ]; then
            echo "::error::インスタンス ${EC2_INSTANCE_ID} のパブリックアドレスを解決できませんでした (起動中か / パブリック IP 付与を確認)" >&2
            exit 1
          fi
        fi
        echo "host=${HOST}" >> "${GITHUB_OUTPUT}"
        echo "Resolved EC2 host: ${HOST}"

    - id: ssh-setup
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        RESOLVED_HOST: ${{ steps.resolve.outputs.host }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if [ -n "${KNOWN_HOSTS}" ]; then
          # 固定 known_hosts を使用 (MITM 検証あり、推奨)。
          printf '%s\n' "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          echo "EC2_SSH_KNOWN_HOSTS による host key 検証を有効化しました"
        else
          # フォールバック: ssh-keyscan TOFU。攻撃者が経路上で偽鍵を返すと検知できないため、
          # 本番は EC2_SSH_KNOWN_HOSTS の設定を推奨 (deploy/README.md §1.4)。
          echo "::warning::EC2_SSH_KNOWN_HOSTS 未設定。ssh-keyscan(TOFU) で接続します (MITM 検証なし)。本番は固定 known_hosts を推奨。"
          ssh-keyscan -T 20 "${RESOLVED_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "::warning::ssh-keyscan が ${RESOLVED_HOST} の鍵取得に失敗しました"
        fi
        chmod 644 ~/.ssh/known_hosts 2>/dev/null || true
