services:
  postgres:
    image: postgres:16-alpine
    container_name: akebono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: akebono-honshu
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: akebono-honshu
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akebono-honshu -d akebono-honshu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    name: akebono-postgres-data
